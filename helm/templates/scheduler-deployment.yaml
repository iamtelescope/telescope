{{- /* On SQLite the scheduler runs as a sidecar of the web pod, which holds the migrated file. */}}
{{- if and .Values.scheduler.enabled (ne .Values.database.type "sqlite") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telescope.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicas }}
  # Recreate avoids two schedulers overlapping during a rollout; the DB lease covers the rest.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "telescope.name" . }}-scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scheduler
  # Its own name label keeps these pods out of the web Service and PodDisruptionBudget.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "telescope.name" . }}-scheduler
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scheduler
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        {{- include "telescope.schedulerContainer" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "telescope.fullname" . }}-config
{{- end }}
