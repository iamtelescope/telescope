{% extends "auth.html" %}
{% block title %}Log out · Telescope{% endblock %}
{% block body %}
<main class="auth-page">
  <div class="form-box">
    <img class="logo" src="static/namedlogo.png" alt="Telescope" />
    <h1 class="form-label">Log out of Telescope?</h1>
    <form action="logout" method="post">
      {% csrf_token %}
      <button class="btn btn-submit" type="submit" autofocus data-testid="logout-submit">Log out</button>
    </form>
    <a class="btn btn-secondary" href="./">Cancel</a>
  </div>
</main>
{% endblock %}
